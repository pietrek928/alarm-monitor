[project]
name = "alarm_monitor"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "httpx",
    "click",
    "unidecode",
    "dataclasses_json",
]

[project.scripts]
monitor_alarm = "alarm_monitor.monitor:monitor_alarm"

[build-system]
requires = ["scikit-build-core>=0.12", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["alarm_monitor"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "alarm_monitor/**/*.{h,hpp,cc,cpp}" },
]
