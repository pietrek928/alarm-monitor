[project]
name = "alarm_monitor"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "httpx",
    "click",
    "unidecode",
    "dataclasses_json",
]

[project.scripts]
monitor_alarm = "alarm_monitor.monitor:monitor_alarm"

[build-system]
requires = ["scikit-build-core>=0.12", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/alarm_monitor"]
wheel.exclude = ["**/*.cc", "**/*.h"]
# Ignore .gitignore during packaging. A project-root venv can leave a catch-all
# `*` ignore that would otherwise omit all pure-Python modules from the wheel.
sdist.inclusion-mode = "manual"
sdist.exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "**/*.egg-info",
    "**/__pycache__",
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "src/alarm_monitor/**/*.{h,cc}" },
]
